name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare and Build Debug APK
        run: |
          # Если проект лежит внутри подпапки MindMapApp, переходим в неё
          if [ -f "MindMapApp/settings.gradle.kts" ]; then
            cd MindMapApp
          fi
          # Удаляем Windows-файл local.properties, чтобы использовался SDK сервера GitHub
          rm -f local.properties
          # Запускаем сборку с выводом точной причины ошибки
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindMap-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
